services:
  - type: web
    name: streaming-url-gen-bot
    runtime: docker
    plan: free
    region: frankfurt
    branch: render
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_VIDEO_SIZE
        value: "2147483648"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false

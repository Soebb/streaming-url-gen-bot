services:
  - type: web
    name: streaming-url-gen-bot
    runtime: docker
    plan: starter
    region: frankfurt
    branch: feature/render-deployment
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MEDIA_DIR
        value: /var/data/media
      - key: MAX_VIDEO_SIZE
        value: "2147483648"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
    disk:
      name: telegram-video-storage
      mountPath: /var/data
      sizeGB: 10
